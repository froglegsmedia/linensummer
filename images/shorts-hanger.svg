<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t-shorts">
  <title id="t-shorts">Undyed linen shorts with a drawstring, on a wooden hanger</title>
