<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="t2">
  <title id="t2">Undyed linen shirt, folded</title>
  <defs>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e5d3b4"/>
      <path d="M0 4 H8" stroke="#d9c4a2" stroke-width="0.8"/>
      <path d="M4 0 V8" stroke="#f0e3cb" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="900" height="760" fill="#f3ecdf"/>
  <ellipse cx="450" cy="640" rx="280" ry="16" fill="#1c1814" opacity="0.06"/>
  <!-- lower folds -->
  <rect x="214" y="292" width="500" height="300" rx="3" fill="#d2be9c"/>
  <rect x="196" y="262" width="516" height="292" rx="3" fill="#dcc7a6" stroke="#1c1814" stroke-width="1.6"/>
  <!-- top fold -->
  <rect x="168" y="188" width="548" height="300" fill="url(#weave)" stroke="#1c1814" stroke-width="2.2"/>
  <!-- side sleeve edges -->
  <rect x="132" y="250" width="40" height="180" fill="#d7c4a4" stroke="#1c1814" stroke-width="1.6"/>
  <rect x="712" y="250" width="40" height="180" fill="#d7c4a4" stroke="#1c1814" stroke-width="1.6"/>
  <!-- collar lying on the fold -->
  <path fill="#efe4ce" stroke="#1c1814" stroke-width="2" stroke-linejoin="round" d="M300 196 L430 196 L448 236 L360 318 L268 230 Z"/>
  <path fill="#efe4ce" stroke="#1c1814" stroke-width="2" stroke-linejoin="round" d="M600 196 L470 196 L452 236 L540 318 L632 230 Z"/>
  <path d="M360 318 L450 248 L540 318" fill="none" stroke="#1c1814" stroke-width="1.5"/>
  <!-- placket on the fold -->
  <path d="M450 248 V470" fill="none" stroke="#1c1814" stroke-width="1.6"/>
  <g fill="#f7f1e4" stroke="#1c1814" stroke-width="1.5">
    <circle cx="450" cy="250" r="8"/>
    <circle cx="450" cy="330" r="8"/>
    <circle cx="450" cy="410" r="8"/>
  </g>
  <g fill="#1c1814">
    <circle cx="447" cy="248" r="1"/>
    <circle cx="453" cy="252" r="1"/>
    <circle cx="447" cy="328" r="1"/>
    <circle cx="453" cy="332" r="1"/>
    <circle cx="447" cy="408" r="1"/>
    <circle cx="453" cy="412" r="1"/>
  </g>
  <!-- fold crease -->
  <path d="M168 360 H716" fill="none" stroke="#c9b48c" stroke-width="1.5"/>
</svg>
