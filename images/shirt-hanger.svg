  <path d="M552 390 C532 520 554 700 548 850" fill="none" stroke="#c4ae88" stroke-width="2"/>
  <path d="M360 300 C372 480 358 680 370 840" fill="none" stroke="#d2be9a" stroke-width="1.5"/>
  <!-- hem -->
  <path d="M226 868 H574" fill="none" stroke="#1c1814" stroke-width="2.25"/>
  <path d="M226 842 V868 M574 842 V868" fill="none" stroke="#1c1814" stroke-width="1.6"/>
