  <!-- sleeve shade -->
  <path fill="url(#weave-dark)" opacity="0.95" d="M186 228 L98 314 L126 414 L208 350 Z"/>
  <path fill="url(#weave-dark)" opacity="0.95" d="M614 228 L702 314 L674 414 L592 350 Z"/>
  <path d="M186 226 L96 312 L124 418 L210 352" fill="none" stroke="#1c1814" stroke-width="2.25" stroke-linejoin="round"/>
  <path d="M614 226 L704 312 L676 418 L590 352" fill="none" stroke="#1c1814" stroke-width="2.25" stroke-linejoin="round"/>
