<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t1">
  <title id="t1">Undyed linen shirt on a wooden hanger</title>
  <defs>
    <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#e6d4b6"/>
      <path d="M0 3.5 H7" stroke="#dcc6a4" stroke-width="0.7"/>
      <path d="M3.5 0 V7" stroke="#f1e4cc" stroke-width="0.7"/>
    </pattern>
    <pattern id="weave-dark" width="7" height="7" patternUnits="userSpaceOnUse">
