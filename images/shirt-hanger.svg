      <path d="M0 3.5 H7" stroke="#c9b38c" stroke-width="0.7"/>
      <path d="M3.5 0 V7" stroke="#e2d0b0" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#f3ecdf"/>
  <ellipse cx="400" cy="918" rx="210" ry="14" fill="#1c1814" opacity="0.06"/>
  <!-- hanger bar, mostly hidden by the collar -->
  <path d="M168 206 L400 96 L632 206" fill="none" stroke="#7a5734" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M400 96 V158" fill="none" stroke="#7a5734" stroke-width="8" stroke-linecap="round"/>
