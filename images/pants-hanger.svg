<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t-pants">
  <title id="t-pants">Undyed linen pants on a wooden hanger</title>
  <defs>
    <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#e6d4b6"/>
      <path d="M0 3.5 H7" stroke="#dcc6a4" stroke-width="0.7"/>
      <path d="M3.5 0 V7" stroke="#f1e4cc" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#f3ecdf"/>
  <ellipse cx="400" cy="948" rx="220" ry="14" fill="#1c1814" opacity="0.06"/>
  <!-- hanger -->
  <path d="M196 236 L400 128 L604 236" fill="none" stroke="#7a5734" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M400 128 V186" fill="none" stroke="#7a5734" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 128 C398 78 458 66 470 118" fill="none" stroke="#6a4a2c" stroke-width="7" stroke-linecap="round"/>
  <!-- legs, under the waistband -->
  <path fill="url(#weave)" stroke="#1c1814" stroke-width="2.25" stroke-linejoin="round" d="
    M228 332
    C214 470 196 690 214 908
    H352
    L374 548
    C388 598 412 598 426 548
    L448 908
    H586
    C604 690 586 470 572 332
    Z"/>
  <!-- waistband -->
  <path fill="url(#weave)" stroke="#1c1814" stroke-width="2.25" stroke-linejoin="round" d="M214 268 H586 V338 H214 Z"/>
  <path d="M214 300 H586" fill="none" stroke="#c4ae88" stroke-width="1.4"/>
  <!-- clips -->
  <g stroke="#1c1814" stroke-width="1.5">
    <rect x="286" y="228" width="26" height="58" rx="2" fill="#6a4a2c"/>
    <rect x="488" y="228" width="26" height="58" rx="2" fill="#6a4a2c"/>
    <path d="M290 252 H308" fill="none" stroke="#e7d7bc" stroke-width="1.6"/>
    <path d="M492 252 H510" fill="none" stroke="#e7d7bc" stroke-width="1.6"/>
    <path d="M292 276 H306" fill="none" stroke="#3a2a1c" stroke-width="1.2"/>
    <path d="M494 276 H508" fill="none" stroke="#3a2a1c" stroke-width="1.2"/>
  </g>
  <!-- pleats and fly -->
  <path d="M318 338 C322 420 314 500 320 560" fill="none" stroke="#c4ae88" stroke-width="1.7"/>
  <path d="M482 338 C478 420 486 500 480 560" fill="none" stroke="#c4ae88" stroke-width="1.7"/>
  <path d="M400 338 V430" fill="none" stroke="#1c1814" stroke-width="1.5"/>
  <!-- pockets -->
  <path d="M248 392 C286 408 308 452 296 508" fill="none" stroke="#1c1814" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M552 392 C514 408 492 452 504 508" fill="none" stroke="#1c1814" stroke-width="1.6" stroke-linecap="round"/>
  <!-- side folds -->
  <path d="M246 400 C236 560 228 740 236 880" fill="none" stroke="#d2be9a" stroke-width="1.5"/>
  <path d="M554 400 C564 560 572 740 564 880" fill="none" stroke="#d2be9a" stroke-width="1.5"/>
  <!-- cuffs -->
  <path d="M214 868 H352" fill="none" stroke="#1c1814" stroke-width="1.7"/>
  <path d="M448 868 H586" fill="none" stroke="#1c1814" stroke-width="1.7"/>
  <path d="M226 868 V908 M340 868 V908 M460 868 V908 M574 868 V908" fill="none" stroke="#1c1814" stroke-width="1.4"/>
</svg>
